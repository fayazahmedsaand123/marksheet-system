<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Marksheet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a href="/" class="navbar-brand">
                <i class="bi bi-mortarboard-fill me-2"></i>
                Marksheet System
            </a>
            <div class="d-flex gap-2">
                <span class="navbar-text text-white me-2">
                    <i class="bi bi-person-circle me-1"></i>
                    {{ session["user_name"] }}
                </span>
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house-door me-1"></i>
                    Dashboard
                </a>
                <a href="/create" class="btn btn-primary btn-sm">
                    <i class="bi bi-plus-circle me-1"></i>
                    New Marksheet
                </a>
                <a href="/logout" class="btn btn-danger btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout
                </a>
            </div>
        </div>
    </nav>

     <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="bi bi-plus-circle me-2"></i>
                    New Marksheet
                </h4>
            </div>
            <div class="card-body">
                <form action="/create" method="POST">
                    <h6 class="text-muted mb-3">Student Information</h6>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Student Name</label>
                            <input type="text" name="student_name" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Roll Number</label>
                            <input type="text" name="roll_number" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Class</label>
                            <select name="class" class="form-select" required>
                                <option value="">Select</option>
                                <option value="9">Class 9</option>
                                <option value="10">Class 10</option>
                                <option value="11">Class 11</option>
                                <option value="12">Class 12</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Examination</label>
                            <select name="exam_name" class="form-select" required>
                                <option value="">Select</option>
                                <option value="Midterm">Midterm</option>
                                <option value="Final">Final</option>
                                <option value="Annual">Annual</option>
                            </select>
                        </div>
                    </div>

                    <h6 class="text-muted mb-3">Subject Marks (Max: 100 each)</h6>
                    <div class="row mb-4">
                        <div class="col-md-2">
                            <label class="form-label">English</label>
                            <input type="number" name="english" class="form-control" min="0" max="100" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Mathematics</label>
                            <input type="number" name="mathematics" class="form-control" min="0" max="100" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Computer</label>
                            <input type="number" name="computer" class="form-control" min="0" max="100" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Physics</label>
                            <input type="number" name="physics" class="form-control" min="0" max="100" required>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Chemistry</label>
                            <input type="number" name="chemistry" class="form-control" min="0" max="100" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Save Marksheet
                    </button>
                    <a href="/" class="btn btn-secondary">
                        <i class="bi bi-arrow-left me-2"></i>Cancel
                    </a>
                </form>
            </div>
        </div>
     </div>
</body>
</html>
